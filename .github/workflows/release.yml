name: Publicar instalador

# Publicar uma versão: npm run versao:patch (ou :minor), commit, e depois
#   git tag vX.Y.Z && git push origin vX.Y.Z
# O GitHub compila o instalador do Windows e cria a release; os apps instalados se atualizam sozinhos.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versão do pacote = nome da tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm test
      - name: Compilar instalador
        run: npx electron-builder --config electron-builder.config.js --win --publish never
      - name: Criar release e anexar arquivos
        shell: bash
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}" --generate-notes dist/PDV-Restaurante-Setup-*.exe dist/PDV-Restaurante-Setup-*.exe.blockmap dist/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
